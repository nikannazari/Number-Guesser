[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "number-guesser"
version = "1.0.0"
description = "A modular number guessing game built with Python, CLI, and Streamlit."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
